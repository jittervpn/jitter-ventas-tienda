<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0c0f17">
<title>Admin · Jitterx Panel Cloud</title>
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: dark;
  --bg: #0c0f17; --card: #151a26; --card-2: #1b2130; --card-3: #232a3b;
  --line: rgba(255,255,255,.07); --line-2: rgba(255,255,255,.12);
  --ink: #eef1f8; --ink-2: #c3c9d8; --muted: #8b93a7;
  --accent: #6c7bff; --accent-soft: rgba(108,123,255,.14); --grad: linear-gradient(135deg,#6c7bff 0%,#8b5cf6 100%);
  --ok: #34d399; --warn: #fbbf24; --err: #f87171; --err-soft: rgba(248,113,113,.14);
  --c1:#6c7bff; --c1s:rgba(108,123,255,.16); --c2:#22d3ee; --c2s:rgba(34,211,238,.14); --c3:#fbbf24; --c3s:rgba(251,191,36,.14);
  --c4:#34d399; --c4s:rgba(52,211,153,.14); --c5:#f472b6; --c5s:rgba(244,114,182,.14); --c6:#38bdf8; --c6s:rgba(56,189,248,.14);
  --font: "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --r: 14px; --r-lg: 20px; --gutter: 32px;
}
@media (max-width: 40rem) { :root { --gutter: 16px; } }
*, *::before, *::after { box-sizing: border-box; }
html, body { overflow-x: clip; }
body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: .9375rem; line-height: 1.55; -webkit-font-smoothing: antialiased;
  background-image: radial-gradient(900px 420px at 15% -8%, rgba(108,123,255,.14), transparent 60%); background-repeat: no-repeat; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg { display: block; }

.top { position: sticky; top: 0; z-index: 10; background: rgba(12,15,23,.82); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
.top .in { max-width: 1200px; margin: 0 auto; padding: 12px var(--gutter); display: flex; align-items: center; gap: 12px; }
.logo { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: -.02em; color: var(--ink); text-decoration: none; }
.logo .mk { width: 34px; height: 34px; border-radius: 10px; background: var(--grad); display: grid; place-items: center; }
.logo .mk svg { width: 18px; height: 18px; color: #fff; }
.logo small { display: block; font-size: .6875rem; font-weight: 600; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; line-height: 1; margin-top: 2px; }
.top .sp { flex: 1; }
.who { font-size: .8125rem; color: var(--muted); max-width: 32ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ghost { display: inline-flex; align-items: center; gap: 6px; min-height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--card); color: var(--ink-2); font-size: .8125rem; font-weight: 600; text-decoration: none; }
.ghost:hover { color: var(--ink); background: var(--card-2); }
.ghost svg { width: 16px; height: 16px; }
@media (max-width: 40rem) { .who, .ghost .t { display: none; } .ghost { padding: 0 10px; } }

.wrap { max-width: 1200px; margin: 0 auto; padding: 28px var(--gutter) 64px; display: grid; grid-template-columns: 220px minmax(0,1fr); gap: 28px; align-items: start; }
@media (max-width: 60rem) { .wrap { grid-template-columns: 1fr; gap: 18px; padding-top: 18px; } }
.side { position: sticky; top: 84px; display: grid; gap: 4px; }
.side button { display: flex; align-items: center; gap: 10px; min-height: 42px; padding: 0 12px; border: 0; border-radius: 12px; background: transparent; color: var(--ink-2); font-weight: 600; font-size: .875rem; text-align: left; }
.side button svg { width: 18px; height: 18px; flex: none; color: var(--muted); }
.side button:hover { background: var(--card); color: var(--ink); }
.side button[aria-current="page"] { background: var(--accent-soft); color: var(--ink); }
.side button[aria-current="page"] svg { color: var(--accent); }
.side .soon { margin-left: auto; font-size: .6875rem; color: var(--muted); font-weight: 600; }
@media (max-width: 60rem) { .side { position: static; display: flex; overflow-x: auto; gap: 6px; padding-bottom: 4px; scrollbar-width: none; } .side button { flex: none; background: var(--card); border: 1px solid var(--line); } .side .soon { display: none; } }

h1 { margin: 0; font-size: 1.625rem; letter-spacing: -.02em; line-height: 1.2; }
.sub { margin: 6px 0 0; color: var(--muted); font-size: .875rem; }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }

.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 18px; display: grid; gap: 10px; min-height: 132px; }
.stat .ic { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; }
.stat .ic svg { width: 20px; height: 20px; }
.stat .n { font-size: 1.875rem; font-weight: 800; letter-spacing: -.02em; line-height: 1; font-variant-numeric: tabular-nums; }
.stat .n small { font-size: .875rem; font-weight: 600; color: var(--muted); letter-spacing: 0; margin-left: 4px; }
.stat .l { font-size: .8125rem; color: var(--muted); font-weight: 600; }
.stat .x { font-size: .75rem; color: var(--err); }
.k1 { background: var(--c1s); color: var(--c1); } .k2 { background: var(--c2s); color: var(--c2); } .k3 { background: var(--c3s); color: var(--c3); }
.k4 { background: var(--c4s); color: var(--c4); } .k5 { background: var(--c5s); color: var(--c5); } .k6 { background: var(--c6s); color: var(--c6); }
.skel .n { width: 70px; height: 30px; border-radius: 8px; background: linear-gradient(90deg, var(--card-2), var(--card-3), var(--card-2)); background-size: 200% 100%; animation: sh 1.2s linear infinite; color: transparent; }
@keyframes sh { to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .skel .n { animation: none; } }

.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 22px; }
.empty { margin-top: 18px; text-align: center; padding: 36px 22px; border: 1.5px dashed var(--line-2); border-radius: var(--r-lg); color: var(--muted); }
.empty svg { width: 34px; height: 34px; margin: 0 auto 10px; color: var(--accent); }
.empty b { display: block; color: var(--ink); font-size: 1rem; margin-bottom: 4px; }

.gate { max-width: 420px; margin: 8vh auto 0; padding: 0 var(--gutter); }
.gate .card { padding: 28px; }
.gate h1 { font-size: 1.375rem; }
.gate label { display: block; margin: 18px 0 6px; font-size: .8125rem; font-weight: 700; color: var(--ink-2); }
.gate input { width: 100%; min-height: 46px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--card-2); }
.gate input:focus { border-color: var(--accent); outline: none; }
.gate .code { font-family: var(--mono); letter-spacing: .4em; text-align: center; font-size: 1.25rem; }
.primary { width: 100%; min-height: 46px; margin-top: 16px; border: 0; border-radius: 12px; background: var(--grad); color: #fff; font-weight: 800; }
.primary:disabled { opacity: .6; cursor: wait; }
.link { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; font-size: .8125rem; margin-top: 12px; }
.msg { margin-top: 12px; font-size: .8125rem; border-radius: 10px; padding: 10px 12px; }
.msg.err { background: var(--err-soft); color: #fecaca; }
.msg.ok { background: rgba(52,211,153,.12); color: #bbf7d0; }
.denied { text-align: center; }
.card + .card { margin-top: 16px; }
.card h2 { margin: 0 0 4px; font-size: 1.0625rem; }
.fld { display: grid; gap: 6px; }
.fld label { font-size: .8125rem; font-weight: 700; color: var(--ink-2); }
.inp { min-height: 46px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--card-2); width: 100%; }
.inp:focus { border-color: var(--accent); outline: none; }
.pre { display: flex; align-items: center; border: 1px solid var(--line-2); border-radius: 12px; background: var(--card-2); overflow: hidden; }
.pre:focus-within { border-color: var(--accent); }
.pre b { padding: 0 12px; color: var(--muted); font-size: .8125rem; border-right: 1px solid var(--line); align-self: stretch; display: grid; place-items: center; }
.pre input { border: 0; background: transparent; min-height: 46px; padding: 0 14px; width: 100%; font-variant-numeric: tabular-nums; font-weight: 700; font-size: 1.0625rem; }
.pre input:focus { outline: none; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 16px; }
@media (max-width: 40rem) { .grid2 { grid-template-columns: 1fr; } }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 18px; border: 0; border-radius: 12px; background: var(--grad); color: #fff; font-weight: 800; }
.btn:disabled { opacity: .6; cursor: wait; }
.btn.sm { min-height: 34px; padding: 0 12px; font-size: .8125rem; border-radius: 10px; }
.btn.alt { background: var(--card-2); color: var(--ink); border: 1px solid var(--line-2); font-weight: 700; }
.row-act { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 16px; }
.hint { font-size: .8125rem; color: var(--muted); margin: 8px 0 0; }
.list { display: grid; gap: 10px; margin-top: 14px; }
.it { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 14px 16px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
.it .p { font-family: var(--mono); font-size: .8125rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.it .e { font-size: .8125rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.it .m { font-size: .8125rem; color: var(--ink-2); display: grid; gap: 2px; }
.it .m span { color: var(--muted); font-size: .75rem; }
@media (max-width: 40rem) { .it { grid-template-columns: 1fr; gap: 8px; } }
.pill { display: inline-flex; align-items: center; min-height: 22px; padding: 0 8px; border-radius: 999px; font-size: .6875rem; font-weight: 700; background: rgba(52,211,153,.14); color: var(--ok); }
.pill.w { background: rgba(251,191,36,.14); color: var(--warn); } .pill.o { background: var(--card-3); color: var(--muted); } .pill.r { background: var(--err-soft); color: var(--err); }
.search { margin-top: 4px; }
.sw { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; font-size: .875rem; cursor: pointer; }
.sw input { width: 20px; height: 20px; accent-color: var(--accent); }
.badge { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 6px; margin-left: auto; border-radius: 999px; background: var(--warn); color: #1a1205; font-size: .6875rem; font-weight: 800; }
pre.raw { margin: 12px 0 0; max-height: 420px; overflow: auto; padding: 14px; border-radius: 12px; background: #090c12; border: 1px solid var(--line); font: .75rem/1.5 var(--mono); color: var(--ink-2); white-space: pre-wrap; word-break: break-all; }
.denied svg { width: 40px; height: 40px; margin: 0 auto 12px; color: var(--err); }
</style>
</head>
<body>
<header class="top"><div class="in">
  <a class="logo" href="/admin"><span class="mk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></span><span>Jitterx<small>Administración</small></span></a>
  <span class="sp"></span>
  <span class="who" id="who" hidden></span>
  <a class="ghost" href="/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg><span class="t">Ver la web</span></a>
  <button class="ghost" id="salir" type="button" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg><span class="t">Salir</span></button>
</div></header>

<!-- Acceso -->
<section class="gate" id="login" hidden>
  <div class="card">
    <h1>Entrar al admin</h1>
    <p class="sub">Te enviamos un código a tu correo de administrador.</p>
    <form id="f1">
      <label for="email">Correo</label>
      <input id="email" type="email" autocomplete="email" inputmode="email" required placeholder="tu@correo.com">
      <button class="primary" id="b1" type="submit">Enviar código</button>
    </form>
    <form id="f2" hidden>
      <label for="code">Código de 6 dígitos</label>
      <input id="code" class="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="\d{6}" required placeholder="••••••">
      <button class="primary" id="b2" type="submit">Entrar</button>
      <button class="link" id="otro" type="button">Usar otro correo</button>
    </form>
    <div class="msg" id="lmsg" hidden role="status"></div>
  </div>
</section>

<section class="gate" id="denied" hidden>
  <div class="card denied">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m4.9 4.9 14.2 14.2"/></svg>
    <h1>Sin acceso</h1>
    <p class="sub" id="deniedT">Esta cuenta no es de administrador.</p>
    <button class="primary" id="salir2" type="button">Entrar con otra cuenta</button>
  </div>
</section>

<!-- Panel -->
<div class="wrap" id="app" hidden>
  <nav class="side" aria-label="Secciones del admin" id="nav"></nav>
  <main id="main"></main>
</div>

<script>
const TK='jx_token';
const $=s=>document.querySelector(s);
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const tok=()=>{try{return localStorage.getItem(TK)}catch{return null}};
const setTok=t=>{try{t?localStorage.setItem(TK,t):localStorage.removeItem(TK)}catch{}};
async function api(path,opts={}){
  const t=tok(); const r=await fetch(path,{...opts,headers:{'content-type':'application/json',...(t?{authorization:'Bearer '+t}:{}),...(opts.headers||{})}});
  let j={}; try{ j=await r.json() }catch{}
  return {status:r.status,...j};
}
const show=id=>['login','denied','app'].forEach(x=>$('#'+x).hidden=x!==id);
function lmsg(tipo,t){ const m=$('#lmsg'); m.hidden=!t; m.className='msg '+(tipo||''); m.textContent=t||''; }
function salir(){ setTok(null); $('#who').hidden=true; $('#salir').hidden=true; $('#f2').hidden=true; $('#f1').hidden=false; lmsg(); show('login'); }
$('#salir').onclick=salir; $('#salir2').onclick=salir;

// ---- acceso con código por correo (mismo login que la web) ----
$('#f1').onsubmit=async e=>{ e.preventDefault(); const b=$('#b1'); b.disabled=true; lmsg();
  const j=await api('/api/auth/codigo',{method:'POST',body:JSON.stringify({accion:'pedir',email:$('#email').value.trim()})}).catch(()=>({error:'Sin conexión.'}));
  b.disabled=false;
  if(!j.ok) return lmsg('err',j.error||'No se pudo enviar el código.');
  $('#f1').hidden=true; $('#f2').hidden=false; $('#code').focus(); lmsg('ok','Revisa tu correo: el código vence en 10 minutos.'); };
$('#f2').onsubmit=async e=>{ e.preventDefault(); const b=$('#b2'); b.disabled=true; lmsg();
  const j=await api('/api/auth/codigo',{method:'POST',body:JSON.stringify({accion:'verificar',email:$('#email').value.trim(),code:$('#code').value})}).catch(()=>({error:'Sin conexión.'}));
  b.disabled=false;
  if(!j.token) return lmsg('err',j.error||'Código incorrecto.');
  setTok(j.token); $('#code').value=''; iniciar(); };
$('#otro').onclick=()=>{ $('#f2').hidden=true; $('#f1').hidden=false; lmsg(); };

// ---- secciones ----
const IC={
  home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  coin:'<circle cx="12" cy="12" r="9"/><path d="M14.5 9.5c-.4-.9-1.4-1.5-2.5-1.5-1.4 0-2.5.8-2.5 2s1.1 1.7 2.5 2 2.5.8 2.5 2-1.1 2-2.5 2c-1.1 0-2.1-.6-2.5-1.5M12 6.5V8M12 16v1.5"/>',
  users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
  cloud:'<path d="M17.5 19a4.5 4.5 0 1 0-1.4-8.78A6 6 0 1 0 6 17.5"/><path d="M6 19h11.5"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  gift:'<path d="M20 12v10H4V12M2 7h20v5H2zM12 22V7M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7zM12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/>',
  tag:'<path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  ticket:'<path d="M3 9a3 3 0 0 0 0 6v3a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-3a3 3 0 0 0 0-6V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2z"/><path d="M9 9h.01M15 15h.01M15.5 8.5l-7 7"/>',
};
const svg=k=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+IC[k]+'</svg>';
// Para añadir una sección: {id, t, ic, render(main)}. Las que aún no existen se muestran como «Próximamente».
let actual='resumen';
const SECCIONES=[
  {id:'resumen',t:'Resumen',ic:'home',render:resumen},
  {id:'servicios',t:'Servicios y tráfico',ic:'cloud',render:servicios},
  {id:'precios',t:'Precios',ic:'tag',render:precios},
  {id:'cupones',t:'Cupones',ic:'ticket',render:cupones},
  {id:'pruebas',t:'Pruebas de 1 hora',ic:'gift',render:pruebas},
  {id:'crear',t:'Crear sin cobro',ic:'plus',render:crear},
  {id:'api',t:'API del CDN',ic:'coin',render:apiCdn},
];
const deHash=()=>{ const h=(location.hash||'').slice(1); return SECCIONES.some(x=>x.id===h)?h:'resumen'; };
actual=deHash();
window.addEventListener('hashchange',()=>{ const h=deHash(); if(h!==actual&&!$('#app').hidden){ actual=h; nav(); abrir(); } });
function nav(){
  $('#nav').innerHTML=SECCIONES.map(s=>'<button type="button" data-s="'+s.id+'"'+(s.id===actual?' aria-current="page"':'')+'>'+svg(s.ic)+esc(s.t)+(s.render?'':'<span class="soon">Pronto</span>')+'</button>').join('');
  $('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{ actual=b.dataset.s; try{history.replaceState(null,'','#'+actual)}catch{} nav(); abrir(); });
}
function abrir(){ const s=SECCIONES.find(x=>x.id===actual)||SECCIONES[0]; s.render($('#main')); }

const num=n=>n==null?'—':Number(n).toLocaleString('es-AR');
function saldoDe(s){ if(!s||s.error) return null; const b=s.balance??s.credits??s.available??(s.data&&(s.data.balance??s.data.credits??s.data.available)); return b; }
function tarjeta(k,ic,n,l,extra,err){ return '<div class="stat"><span class="ic '+k+'">'+svg(ic)+'</span><div class="n">'+n+(extra?'<small>'+esc(extra)+'</small>':'')+'</div><div class="l">'+esc(l)+'</div>'+(err?'<div class="x">'+esc(err)+'</div>':'')+'</div>'; }

async function resumen(main){
  main.innerHTML='<div class="head"><div><h1>Resumen</h1><p class="sub">Así va tu negocio ahora mismo.</p></div><button class="ghost" id="rec" type="button">Actualizar</button></div>'+
    '<div class="stats">'+Array.from({length:6},()=>'<div class="stat skel"><span class="ic k1"></span><div class="n">0</div><div class="l">Cargando…</div></div>').join('')+'</div>';
  $('#rec').onclick=()=>resumen(main);
  const d=await api('/api/admin').catch(()=>({error:'Sin conexión.'}));
  if(d.status===401) return salir();
  if(d.status===403){ $('#deniedT').textContent=d.error||'Esta cuenta no es de administrador.'; return show('denied'); }
  if(d.error&&!d.cdn){ main.querySelector('.stats').outerHTML='<div class="msg err">'+esc(d.error)+'</div>'; return; }
  const c=d.cdn||{}, p=d.pruebas||{}, pr=d.precios||{}, sb=saldoDe(d.saldo);
  const precio=(pr.tarjeta!=null?'$ '+num(pr.tarjeta):'—');
  main.querySelector('.stats').innerHTML=
    tarjeta('k1','coin',sb==null?'—':num(sb),'Créditos del CDN','',d.saldo&&d.saldo.error?'No se pudo consultar':'')+
    tarjeta('k4','users',num(c.clientes),'Clientes con CDN',c.activos!=null?num(c.activos)+' activos':'')+
    tarjeta('k2','cloud',num(c.servicios),'Servicios CDN','',c.error?'La API del CDN no respondió':'')+
    tarjeta('k3','clock',num(c.vencenPronto),'Vencen en 7 días')+
    (c.trafico!=null?tarjeta('k2','cloud',bytes(c.trafico),'Tráfico de todos los servicios'):'')+
    tarjeta('k5','gift',num(p.activas),'Pruebas activas',p.pendientes?num(p.pendientes)+' pendientes':'',p.error?'Registro no disponible':'')+
    (d.cupones?tarjeta('k3','ticket',num(d.cupones.pendientes),'Cupones pendientes',d.cupones.activos?num(d.cupones.activos)+' activos · '+num(d.cupones.usados)+' usados':''):'')+
    tarjeta('k6','tag',precio,'Precio CDN 30 días'+(pr.paypal!=null?' · PayPal '+usd(pr.paypal):''));

}

const usd=n=>'USD '+Number(n||0).toFixed(2);
const bytes=b=>{ if(b==null) return '—'; const u=['B','KB','MB','GB','TB']; let i=0; while(b>=1000&&i<u.length-1){ b/=1000; i++; } return (i?b.toFixed(b<10?2:1):b)+' '+u[i]; };
const fecha=ms=>ms?new Date(ms).toLocaleString('es-AR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';
const cabecera=(t,sub,extra)=>'<div class="head"><div><h1>'+esc(t)+'</h1><p class="sub">'+esc(sub)+'</p></div>'+(extra||'')+'</div>';
const caja=(cls,t)=>'<div class="msg '+cls+'">'+esc(t)+'</div>';
async function revisar(d){ if(d.status===401){ salir(); return false; } if(d.status===403){ $('#deniedT').textContent=d.error||'Esta cuenta no es de administrador.'; show('denied'); return false; } return true; }
const post=(url,body)=>api(url,{method:'POST',body:JSON.stringify(body)}).catch(()=>({error:'Sin conexión.'}));

// ---- Servicios y tráfico (todos los clientes) ----
async function servicios(main){
  main.innerHTML=cabecera('Servicios y tráfico','Todos los servicios CDN de tus clientes, del que vence antes al último.','<button class="ghost" id="rec" type="button">Actualizar</button>')+
    '<input class="inp search" id="q" placeholder="Buscar por correo, ruta, host u origen" autocomplete="off" autocapitalize="none" spellcheck="false"><div class="list" id="lst"><div class="hint">Cargando…</div></div>';
  $('#rec').onclick=()=>servicios(main);
  const d=await api('/api/admin?que=servicios').catch(()=>({error:'Sin conexión.'}));
  if(!(await revisar(d))) return;
  const lst=$('#lst');
  if(d.error) return lst.innerHTML=caja('err',d.error);
  const sv=d.servicios||[]; const conTrafico=sv.some(s=>s.trafico);
  const estado=s=>{ if(!s.expira) return ['Sin fecha','o']; const d=Math.ceil((s.expira-Date.now())/864e5); return d<=0?['Vencido','r']:d<=3?['Vence en '+d+' d','w']:['Activo · '+d+' d','']; };
  const pinta=f=>{ const l=sv.filter(s=>!f||[s.email,s.path,s.host,s.origin].some(x=>String(x||'').toLowerCase().includes(f)));
    lst.innerHTML=l.length?l.map(s=>{ const [t,c]=estado(s); const tr=s.trafico;
      return '<div class="it"><div style="min-width:0"><div class="p">'+esc(s.path)+'</div><div class="e">'+esc(s.email||'Cliente sin correo registrado ('+(s.prefijo||'?')+')')+'</div></div>'+
        '<div class="m"><div><span class="pill '+c+'">'+esc(t)+'</span></div><span>Vence '+fecha(s.expira)+'</span>'+(tr?'<span>Tráfico: '+esc([tr.bytes!=null?bytes(tr.bytes):'',tr.peticiones!=null?num(tr.peticiones)+' peticiones':''].filter(Boolean).join(' · '))+'</span>':'')+'<span title="'+esc(s.origin)+'">Origen: '+esc(s.origin||'—')+'</span></div>'+
        '<div><button class="btn sm alt" type="button" data-ren="'+esc(s.id)+'">Renovar gratis</button></div></div>'; }).join('')
      :'<div class="empty"><b>'+(f?'Sin resultados':'Aún no hay servicios')+'</b>'+(f?'Prueba con otra búsqueda.':'Cuando un cliente compre su CDN aparecerá aquí.')+'</div>';
    lst.querySelectorAll('[data-ren]').forEach(b=>b.onclick=async()=>{ if(!confirm('¿Renovar 30 días sin cobro este servicio? Gasta créditos del CDN.')) return; b.disabled=true; const j=await post('/api/admin',{accion:'renovar',id:b.dataset.ren}); b.disabled=false; b.textContent=j.ok?'Renovado ✓':'Error'; if(!j.ok) alert(j.error||'No se pudo renovar.'); });
  };
  pinta(''); $('#q').oninput=e=>pinta(e.target.value.trim().toLowerCase());
  if(sv.length&&!conTrafico) lst.insertAdjacentHTML('beforebegin','<p class="hint">La API del CDN todavía no devolvió datos de tráfico. Revisa la sección «API del CDN» para ver qué responde.</p>');
}

// ---- Precios ----
async function precios(main){
  main.innerHTML=cabecera('Precios','Lo que paga cada cliente por 30 días de CDN.')+'<div class="card" id="pc"><div class="hint">Cargando…</div></div>';
  const d=await api('/api/admin?que=precios').catch(()=>({error:'Sin conexión.'}));
  if(!(await revisar(d))) return;
  const pc=$('#pc'); if(d.error) return pc.innerHTML=caja('err',d.error);
  const cp=d.campana, cv=cp&&cp.activa&&cp.hasta>Date.now();
  pc.innerHTML='<h2>Precio normal · CDN CloudFront 30 días</h2><p class="sub">El cambio se aplica en segundos para compras y renovaciones nuevas. Los pagos que ya estaban en curso con el precio anterior se aceptan durante 48 horas.</p>'+
    '<div class="grid2"><div class="fld"><label for="pa">Tarjeta y Mercado Pago (normal)</label><div class="pre"><b>'+esc(d.moneda)+'</b><input id="pa" inputmode="numeric" value="'+esc(d.ars)+'"></div></div>'+
    '<div class="fld"><label for="pu">PayPal (normal)'+(d.paypal?'':' · desactivado')+'</label><div class="pre"><b>USD</b><input id="pu" inputmode="decimal" value="'+esc(d.usd)+'"></div></div></div>'+
    (cv?'<p class="hint">Con cupón (sección Cupones): <b>'+esc(d.moneda)+' '+num(cp.ars)+'</b> y <b>'+usd(cp.usd)+'</b> hasta el '+new Date(cp.hasta-1000).toLocaleDateString('es-AR')+'.'+((cp.ars>=d.ars||cp.usd>=d.usd)?' <span style="color:var(--err)">⚠ El precio con cupón no es menor que el normal: el cupón no descuenta.</span>':'')+'</p>':'')+
    '<div class="row-act"><button class="btn" id="gp" type="button">Guardar precios</button><span class="hint" style="margin:0">'+(d.actualizado?'Último cambio: '+fecha(d.actualizado)+(d.por?' por '+esc(d.por):''):'Aún no cambiaste los precios desde aquí.')+'</span></div><div id="pm"></div>';
  $('#gp').onclick=async()=>{ const ars=Number(String($('#pa').value).replace(/[.\s]/g,'').replace(',','.')), usdv=Number(String($('#pu').value).replace(',','.'));
    if(!(ars>0)||!(usdv>0)) return $('#pm').innerHTML=caja('err','Escribe precios válidos.');
    if(!confirm('¿Cambiar el precio normal a '+d.moneda+' '+num(ars)+' y '+usd(usdv)+'?')) return;
    const b=$('#gp'); b.disabled=true; const j=await post('/api/admin',{accion:'precios',ars,usd:usdv}); b.disabled=false;
    $('#pm').innerHTML=j.ok?caja('ok','Precios guardados: '+d.moneda+' '+num(j.precios.ars)+' y '+usd(j.precios.usd)+'. Ya se ven en la web.'):caja('err',j.error||'No se pudo guardar.'); };
}

// ---- Pruebas de 1 hora ----
async function pruebas(main){
  main.innerHTML=cabecera('Pruebas de 1 hora','Das una prueba a un correo; el cliente la activa en su sección CDN con su servidor.','<button class="ghost" id="rec" type="button">Actualizar</button>')+'<div id="pb"><div class="hint">Cargando…</div></div>';
  $('#rec').onclick=()=>pruebas(main);
  const d=await api('/api/cdn').catch(()=>({error:'Sin conexión.'}));
  if(!(await revisar(d))) return;
  const pb=$('#pb'); const P=d.pruebas;
  if(d.error||!P) return pb.innerHTML=caja('err',d.error||'No se pudo leer el registro de pruebas.');
  if(P.error) return pb.innerHTML=caja('err',P.error);
  const est={pendiente:['Pendiente','w'],activa:['Activa',''],terminada:['Terminada','o'],cancelada:['Cancelada','o']};
  pb.innerHTML='<div class="card"><h2>Dar una prueba</h2><p class="sub">El cliente entra con ese correo y verá «Tienes una prueba gratis de 1 hora».</p><div class="row-act" style="margin-top:12px"><input class="inp" id="pe" type="email" placeholder="correo@del-cliente.com" autocomplete="off" autocapitalize="none" spellcheck="false" style="flex:1;min-width:200px"><button class="btn" id="pd" type="button">Dar prueba</button></div><div id="pmsg"></div></div>'+
    '<div class="card"><h2>Servicios de pruebas</h2><p class="sub">Al terminar cada prueba el servicio vuelve a <code>'+esc(P.reposo)+'</code>.</p><div class="list">'+
    (P.pool.length?P.pool.map(s=>'<div class="it"><div class="p">'+esc(s.path)+'</div><div class="m">'+(s.ocupadoPor?'<div><span class="pill w">En uso</span></div><span>'+esc(s.ocupadoPor.email)+' hasta '+fecha(s.ocupadoPor.vence)+'</span>':'<div><span class="pill">Libre</span></div>')+'</div><div></div></div>').join('')
      :'<div class="empty"><b>Aún no tienes un servicio de pruebas</b>Créalo una vez en «Crear sin cobro» con un nombre que empiece por <code>prueba</code> (por ejemplo prueba1) y origen <code>'+esc(P.reposo)+'</code>.</div>')+'</div></div>'+
    '<div class="card"><h2>Últimas pruebas</h2><div class="list">'+(P.lista.length?P.lista.map(p=>{ const [t,c]=est[p.estado]||[p.estado,'o'];
      return '<div class="it"><div class="e" style="color:var(--ink)">'+esc(p.email)+'</div><div class="m"><div><span class="pill '+c+'">'+t+'</span></div><span>'+(p.estado==='activa'?'Hasta '+fecha(p.vence):fecha(p.activada||p.creada))+'</span></div><div>'+((p.estado==='pendiente'||p.estado==='activa')?'<button class="btn sm alt" type="button" data-pc="'+p.id+'">'+(p.estado==='activa'?'Cortar':'Cancelar')+'</button>':'')+'</div></div>'; }).join(''):'<div class="hint">Aún no diste ninguna prueba.</div>')+'</div></div>';
  $('#pd').onclick=async()=>{ const email=$('#pe').value.trim().toLowerCase(); if(!email) return $('#pmsg').innerHTML=caja('err','Escribe el correo del cliente.');
    const b=$('#pd'); b.disabled=true; const j=await post('/api/cdn',{accion:'prueba_dar',email}); b.disabled=false;
    if(j.error) return $('#pmsg').innerHTML=caja('err',j.error);
    $('#pmsg').innerHTML=caja('ok',(j.existia?'Ese correo ya tenía una prueba pendiente o activa.':'Prueba lista.')+' El cliente la verá al entrar con '+email+'.'); setTimeout(()=>pruebas(main),1500); };
  pb.querySelectorAll('[data-pc]').forEach(b=>b.onclick=async()=>{ b.disabled=true; const j=await post('/api/cdn',{accion:'prueba_cancelar',id:Number(b.dataset.pc)}); if(j.error){ b.disabled=false; return alert(j.error); } pruebas(main); });
}

// ---- Cupones de descuento ----
async function cupones(main){
  main.innerHTML=cabecera('Cupones','Los clientes reclaman su cupón en la web y tú lo activas aquí con su correo.','<button class="ghost" id="rec" type="button">Actualizar</button>')+'<div id="cu"><div class="hint">Cargando…</div></div>';
  $('#rec').onclick=()=>cupones(main);
  const d=await api('/api/admin?que=cupones').catch(()=>({error:'Sin conexión.'}));
  if(!(await revisar(d))) return;
  const cu=$('#cu'); if(d.error) return cu.innerHTML=caja('err',d.error);
  const c=d.campana, L=d.cupones||[], m=d.moneda||'ARS';
  const vig=c.activa&&c.hasta>Date.now(), N=d.normal||{}, sinDesc=N.ars&&(c.ars>=N.ars||c.usd>=N.usd);
  const fin=new Date(c.hasta-3*36e5-1000).toISOString().slice(0,10); // último día (hora Argentina)
  const pend=L.filter(k=>k.estado==='pendiente'), otros=L.filter(k=>k.estado!=='pendiente');
  const EST={pendiente:['Pendiente','w'],activo:['Activo',''],usado:['Usado','o'],vencido:['Vencido','o'],rechazado:['Rechazado','r']};
  const fila=k=>{ const [t,cl]=EST[k.estado]||[k.estado,'o'];
    return '<div class="it"><div style="min-width:0"><div class="e" style="color:var(--ink)">'+esc(k.email)+'</div><div class="e">'+(k.estado==='usado'?'Usado '+fecha(k.usado):k.activado?'Activado '+fecha(k.activado):'Pedido '+fecha(k.pedido))+'</div></div>'+
      '<div class="m"><div><span class="pill '+cl+'">'+t+'</span></div><span>'+esc(m)+' '+num(k.ars)+' · '+usd(k.usd)+'</span></div>'+
      '<div style="display:flex;gap:6px;flex-wrap:wrap">'+(k.estado==='pendiente'?'<button class="btn sm" type="button" data-act="'+esc(k.email)+'">Activar</button>':'')+((k.estado==='pendiente'||k.estado==='activo')?'<button class="btn sm alt" type="button" data-rej="'+k.id+'">'+(k.estado==='activo'?'Quitar':'Rechazar')+'</button>':'')+'</div></div>'; };
  cu.innerHTML=
    '<div class="card"><h2>Activar por correo</h2><p class="sub">Escribe el Gmail del cliente. Si ya lo pidió, se activa su pedido; si no, se le crea uno ya activo. Le avisamos por correo.</p>'+
      '<div class="row-act" style="margin-top:12px"><input class="inp" id="ce" type="email" placeholder="cliente@gmail.com" autocomplete="off" autocapitalize="none" spellcheck="false" style="flex:1;min-width:200px"><button class="btn" id="ca" type="button"'+(vig?'':' disabled')+'>Activar cupón</button></div><div id="cmsg">'+(vig?'':caja('err','La campaña está cerrada o vencida: ábrela abajo para poder activar cupones.'))+'</div></div>'+
    '<div class="card"><h2>Pedidos pendientes'+(pend.length?' <span class="pill w">'+pend.length+'</span>':'')+'</h2><div class="list">'+(pend.length?pend.map(fila).join(''):'<div class="hint">No hay pedidos pendientes.</div>')+'</div></div>'+
    '<div class="card"><h2>Campaña</h2><p class="sub">Precio con cupón y hasta cuándo vale. Cada cupón sirve para un pago (compra o renovación). Precio normal: '+esc(m)+' '+num(N.ars)+' y '+usd(N.usd)+'.</p>'+(sinDesc?caja('err','El precio con cupón tiene que ser menor que el normal. Revisa aquí o en Precios.'):'')+
      '<div class="row-act" style="margin-top:12px"><label class="sw"><input type="checkbox" id="cact"'+(c.activa?' checked':'')+'> Campaña abierta (se muestra «Reclama tu cupón» en la web)</label></div>'+
      '<div class="grid2"><div class="fld"><label for="cars">Precio con cupón</label><div class="pre"><b>'+esc(m)+'</b><input id="cars" inputmode="numeric" value="'+esc(c.ars)+'"></div></div>'+
      '<div class="fld"><label for="cusd">Precio con cupón (PayPal)</label><div class="pre"><b>USD</b><input id="cusd" inputmode="decimal" value="'+esc(c.usd)+'"></div></div>'+
      '<div class="fld"><label for="cfin">Válido hasta (incluido)</label><input class="inp" id="cfin" type="date" value="'+fin+'"></div></div>'+
      '<div class="row-act"><button class="btn alt" id="cg" type="button">Guardar campaña</button></div><div id="cgm"></div></div>'+
    '<div class="card"><h2>Historial</h2><div class="list">'+(otros.length?otros.slice(0,100).map(fila).join(''):'<div class="hint">Aún no hay cupones activados.</div>')+'</div></div>';
  const activarEmail=async(email,btn)=>{ btn.disabled=true; const j=await post('/api/admin',{accion:'cupon_activar',email}); btn.disabled=false;
    if(j.error) return $('#cmsg').innerHTML=caja('err',j.error);
    $('#cmsg').innerHTML=caja('ok',j.ya?email+' ya tenía el cupón activo.':'Cupón activado para '+email+(j.avisado?'. Le enviamos un correo.':'. (No se pudo enviar el correo de aviso, avísale tú.)'));
    setTimeout(()=>cupones(main),1600); };
  $('#ca').onclick=()=>{ const e=$('#ce').value.trim().toLowerCase(); if(!e) return $('#cmsg').innerHTML=caja('err','Escribe el correo del cliente.'); activarEmail(e,$('#ca')); };
  cu.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{ $('#ce').value=b.dataset.act; activarEmail(b.dataset.act,b); });
  cu.querySelectorAll('[data-rej]').forEach(b=>b.onclick=async()=>{ if(!confirm('¿Seguro?')) return; b.disabled=true; await post('/api/admin',{accion:'cupon_rechazar',id:Number(b.dataset.rej)}); cupones(main); });
  $('#cg').onclick=async()=>{ const f=$('#cfin').value; if(!f) return;
    const [y,mo,da]=f.split('-').map(Number); const hasta=Date.UTC(y,mo-1,da+1,3,0,0); // fin del día elegido, hora Argentina
    const ars=Number(String($('#cars').value).replace(/[.\s]/g,'')), usd=Number(String($('#cusd').value).replace(',','.'));
    const b=$('#cg'); b.disabled=true; const j=await post('/api/admin',{accion:'campana',activa:$('#cact').checked,ars,usd,hasta}); b.disabled=false;
    $('#cgm').innerHTML=j.ok?caja('ok','Campaña guardada. Los cupones activos y pendientes usan el nuevo precio y fecha.'):caja('err',j.error||'No se pudo guardar.'); if(j.ok) setTimeout(()=>cupones(main),1400); };
}

// ---- Crear sin cobro ----
function crear(main){
  main.innerHTML=cabecera('Crear sin cobro','Crea un servicio CDN en tu cuenta sin pagar (gasta créditos del CDN). Úsalo para ti o para servicios de pruebas.')+
    '<div class="card"><div class="grid2" style="margin-top:0"><div class="fld"><label for="co">Origen</label><input class="inp" id="co" placeholder="mi-servidor.com o 203.0.113.10" autocapitalize="none" spellcheck="false"></div>'+
    '<div class="fld"><label for="cr">Nombre de la ruta</label><input class="inp" id="cr" placeholder="prueba1" autocapitalize="none" spellcheck="false"></div></div>'+
    '<p class="hint">2 a 20 letras minúsculas o números. Para el servicio de pruebas usa un nombre que empiece por <code>prueba</code> y origen <code>example.com</code>.</p>'+
    '<div class="row-act"><button class="btn" id="cb" type="button">Crear servicio</button></div><div id="cm"></div></div>';
  $('#cb').onclick=async()=>{ const origen=$('#co').value.trim().toLowerCase(), ruta=$('#cr').value.trim().toLowerCase();
    if(!origen||!/^[a-z0-9]{2,20}$/.test(ruta)) return $('#cm').innerHTML=caja('err','Revisa el origen y el nombre de la ruta.');
    const b=$('#cb'); b.disabled=true; const j=await post('/api/cdn',{accion:'crear',origen,ruta}); b.disabled=false;
    $('#cm').innerHTML=j.ok?caja('ok','Servicio '+(j.path||'')+' en creación. Aparecerá en unos segundos en «Servicios y tráfico» y en tu sección CDN.'):caja('err',j.error||'No se pudo crear.'); };
}

// ---- API del CDN: saldo, datos crudos y diagnóstico de tráfico ----
async function apiCdn(main){
  main.innerHTML=cabecera('API del CDN','Saldo, movimientos y respuestas tal como las devuelve la API. Útil si algo falla.')+
    '<div class="card"><h2>Tráfico</h2><p class="sub">Comprueba qué responde la API sobre el tráfico de un servicio (para activar el tráfico en la web).</p><div class="row-act" style="margin-top:12px"><input class="inp" id="tid" placeholder="ID del servicio" style="flex:1;min-width:200px" autocapitalize="none" spellcheck="false"><button class="btn alt" id="tb" type="button">Comprobar</button></div><pre class="raw" id="tr" hidden></pre></div>'+
    '<div class="card"><h2>Datos crudos</h2><p class="sub">Servicios, movimientos de créditos y saldo.</p><div class="row-act" style="margin-top:12px"><button class="btn alt" id="db" type="button">Cargar</button><button class="btn alt" id="dc" type="button" hidden>Copiar</button></div><pre class="raw" id="dr" hidden></pre></div>';
  $('#tb').onclick=async()=>{ const id=$('#tid').value.trim(); if(!id) return; const t=$('#tr'); t.hidden=false; t.textContent='Consultando…';
    const j=await api('/api/admin?que=trafico&id='+encodeURIComponent(id)).catch(()=>({error:'Sin conexión.'})); t.textContent=JSON.stringify(j,null,2); };
  $('#db').onclick=async()=>{ const t=$('#dr'); t.hidden=false; t.textContent='Cargando…'; const j=await api('/api/cdn?debug=1').catch(()=>({error:'Sin conexión.'}));
    if(!(await revisar(j))) return; t.textContent=JSON.stringify(j,null,2); $('#dc').hidden=false; };
  $('#dc').onclick=()=>navigator.clipboard.writeText($('#dr').textContent).then(()=>{$('#dc').textContent='Copiado ✓'});
  // sugerir un ID para el diagnóstico
  api('/api/admin?que=servicios').then(d=>{ const s=(d.servicios||[])[0]; if(s&&!$('#tid').value) $('#tid').value=s.id; }).catch(()=>{});
}

async function iniciar(){
  if(!tok()) return show('login');
  let email=''; try{ email=JSON.parse(atob(tok().split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).email||''; }catch{}
  $('#who').textContent=email; $('#who').hidden=!email; $('#salir').hidden=false;
  show('app'); nav(); abrir();
}
iniciar();
</script>
